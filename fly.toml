# fly.toml — deploy with:  fly launch --no-deploy   then   fly deploy
# Secrets are NOT stored here. Set them with:
#   fly secrets set STRIPE_SECRET_KEY=sk_live_… SESSION_SECRET=… GOOGLE_CLIENT_ID=… …
app = "koiwrangler"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Scale to zero when nobody is looking at it — this is a pond cleaner's
  # website, not a trading desk. Keeps it inside the free allowance.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[mounts]]
  source = "koiwrangler_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
